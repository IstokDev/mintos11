<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wintux OS — Облегченная версия</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Упрощенная структура без элементов браузера для стабильности на Android -->
    <div id="plymouth-screen" class="plymouth-overlay">
        <div class="plymouth-logo">⚡ WINTUX OS LIGHT</div>
    </div>

    <!-- Основные окна (Терминал, Проводник, CS) -->
    <div class="desktop" id="desktop-grid">
        <div class="shortcut" id="shortcut-terminal">💻 Консоль</div>
        <div class="shortcut" id="shortcut-cs">🔫 CS 1.6</div>
    </div>

    <div id="terminal" class="window">
        <div class="window-header"><div class="window-title">💻 Терминал</div><button class="close-btn" id="close-terminal">✕</button></div>
        <div class="window-body">
            <div id="terminal-history"></div>
            <input type="text" id="terminal-input" autocomplete="off">
        </div>
    </div>

    <div id="cs" class="window">
        <div class="window-header"><div class="window-title">🔫 CS 1.6</div><button class="close-btn" id="close-cs">✕</button></div>
        <div class="window-body">
            <iframe id="cs-frame" src="https://play-cs.com"></iframe>
        </div>
    </div>

    <div class="taskbar">
        <div class="taskbar-icon" id="start-menu-btn">⊞</div>
    </div>

    <script src="fs-core.js"></script>
    <script src="wm-core.js"></script>
    <script src="main.js"></script>
</body>
</html>
